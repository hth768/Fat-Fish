name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile-check Python sources
        shell: bash
        run: |
          set -e
          python3 -m compileall -q -x 'runtime|venv' libs/qq_bot_runtime bridge server.py app.py
          echo "compileall OK"

      - name: Run App unit tests
        shell: bash
        run: |
          set -e
          python3 -m unittest discover -s tests -v 2>&1 | tee test-output.log
          echo "unittest OK"

      - name: Surface failure log as issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('test-output.log', 'utf8'); } catch (e) { log = 'no test-output.log'; }
            const body = '### unittest 失败日志 (auto)\n\n```\n' + log.slice(-6000) + '\n```';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CI unittest 失败日志 ' + context.sha.slice(0,7),
              body: body,
              labels: ['ci-log']
            });

      - name: Syntax-check frontend
        shell: bash
        run: |
          set -e
          node --check webui/app.js
          echo "node check OK"

      - name: Validate plugin manifests
        shell: bash
        run: |
          set -e
          python3 scripts/ci_validate_manifests.py
          echo "manifest validate OK"
