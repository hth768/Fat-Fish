name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile-check Python sources
        shell: bash
        run: |
          set -e
          python3 -m compileall -q -x 'runtime|venv' libs/qq_bot_runtime bridge server.py app.py
          echo "compileall OK"

      - name: Run App unit tests
        shell: bash
        run: |
          set -e
          python3 -m unittest discover -s tests -v 2>&1 | tee test-output.log
          echo "unittest OK"
        continue-on-error: false

      - name: Surface failure log
        if: failure()
        shell: bash
        run: |
          {
            echo "## unittest 失败日志"
            echo '```'
            cat test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Syntax-check frontend
        shell: bash
        run: |
          set -e
          node --check webui/app.js
          echo "node check OK"

      - name: Validate plugin manifests
        shell: bash
        run: |
          set -e
          python3 scripts/ci_validate_manifests.py
          echo "manifest validate OK"
