name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile-check Python sources
        shell: bash
        run: |
          set -e
          python3 -m compileall -q -x 'runtime|venv' libs/qq_bot_runtime bridge server.py app.py
          echo "compileall OK"

      - name: Run App unit tests
        shell: bash
        run: |
          set -e
          python3 -m unittest discover -s tests -v 2>&1 | tee test-output.log
          echo "unittest OK"

      - name: Upload failure log to ci-log branch
        if: failure()
        shell: bash
        run: |
          git config user.email "ci@github.com"
          git config user.name "ci-bot"
          git fetch origin ci-log || true
          git checkout -B ci-log
          cp test-output.log ci_failure.log
          git add ci_failure.log
          git commit -m "CI unittest failure ${GITHUB_SHA:0:7}" || echo "nothing to commit"
          git push origin ci-log

      - name: Syntax-check frontend
        shell: bash
        run: |
          set -e
          node --check webui/app.js
          echo "node check OK"

      - name: Validate plugin manifests
        shell: bash
        run: |
          set -e
          python3 scripts/ci_validate_manifests.py
          echo "manifest validate OK"
