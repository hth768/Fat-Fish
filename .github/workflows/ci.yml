name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile-check Python sources
        shell: bash
        run: |
          set -e
          python3 -m compileall -q -x 'runtime|venv' libs/qq_bot_runtime bridge server.py app.py
          echo "compileall OK"

      - name: Run App unit tests
        shell: bash
        run: |
          set -e
          python3 -m unittest discover -s tests -v 2>&1 | tee test-output.log
          echo "unittest OK"

      - name: Upload failure log to branch
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('test-output.log', 'utf8'); } catch (e) { log = 'no test-output.log'; }
            const content = Buffer.from(log.slice(-8000)).toString('base64');
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'ci-log',
              path: 'ci_failure.log',
              message: 'CI unittest failure ' + context.sha.slice(0,7),
              content: content,
              committer: { name: 'ci-bot', email: 'ci@github.com' },
              author: { name: 'ci-bot', email: 'ci@github.com' }
            });

      - name: Syntax-check frontend
        shell: bash
        run: |
          set -e
          node --check webui/app.js
          echo "node check OK"

      - name: Validate plugin manifests
        shell: bash
        run: |
          set -e
          python3 scripts/ci_validate_manifests.py
          echo "manifest validate OK"
